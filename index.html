<!DOCTYPE html>
<html lang="ur-Latn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HussainHub — Digital Services Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-900:#0F3D3E;
    --teal-700:#155D52;
    --teal-600:#1B6E63;
    --mint-50:#EFF5F1;
    --paper:#FAF8F2;
    --gold-500:#E8A33D;
    --gold-600:#CE8A25;
    --maroon-600:#A32638;
    --ink-900:#14231F;
    --ink-600:#3E4A45;
    --line:#D8E0DA;
    --font-display:'Fraunces', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--mint-50);
    color:var(--ink-900);
    font-family:var(--font-body);
    line-height:1.5;
  }
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:3px solid var(--gold-500);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }

  /* ---------- Header ---------- */
  header.site{
    position:sticky; top:0; z-index:40;
    background:var(--teal-900);
    color:#fff;
    border-bottom:3px solid var(--gold-500);
  }
  .site-inner{
    max-width:1120px; margin:0 auto; padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:20px;
  }
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:700; font-size:1.35rem;}
  .brand .mark{
    width:34px;height:34px;border-radius:8px;
    background:linear-gradient(135deg,var(--gold-500),var(--maroon-600));
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono); font-size:.95rem; color:var(--ink-900); font-weight:700;
  }
  .role-switch{display:flex; gap:6px; background:rgba(255,255,255,.08); padding:4px; border-radius:999px;}
  .role-switch button{
    border:none; background:transparent; color:#DCEAE5;
    padding:8px 16px; border-radius:999px; font-weight:600; font-size:.88rem;
    letter-spacing:.02em; transition:.15s;
  }
  .role-switch button.active{background:var(--gold-500); color:var(--ink-900);}
  .role-switch button:not(.active):hover{background:rgba(255,255,255,.12);}

  nav.subnav{
    background:var(--teal-700); color:#fff;
    border-bottom:1px solid rgba(255,255,255,.12);
  }
  .subnav-inner{max-width:1120px;margin:0 auto;padding:0 20px;display:flex;gap:4px;overflow-x:auto;}
  .subnav-inner button{
    border:none;background:transparent;color:#D3E6E1;padding:12px 14px;
    font-size:.86rem;font-weight:600;white-space:nowrap;border-bottom:3px solid transparent;
  }
  .subnav-inner button.active{color:#fff;border-bottom-color:var(--gold-500);}
  .subnav-inner button:hover{color:#fff;}

  main{max-width:1120px;margin:0 auto;padding:32px 20px 80px;}

  h1,h2,h3{font-family:var(--font-display); margin:0 0 8px; color:var(--teal-900);}
  h1{font-size:2.1rem; font-weight:700;}
  h2{font-size:1.5rem; font-weight:700;}
  h3{font-size:1.1rem; font-weight:600;}
  .eyebrow{
    font-family:var(--font-mono); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase;
    color:var(--maroon-600); font-weight:600; margin-bottom:6px; display:block;
  }
  .lede{color:var(--ink-600); max-width:60ch;}

  /* ---------- Hero ---------- */
  .hero{
    display:grid; grid-template-columns:1.1fr .9fr; gap:40px; align-items:center;
    padding:36px 0 48px;
  }
  @media (max-width:860px){.hero{grid-template-columns:1fr;}}
  .hero h1{font-size:2.6rem; line-height:1.1;}
  .hero-actions{display:flex; gap:12px; margin-top:22px; flex-wrap:wrap;}
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:12px 22px; border-radius:10px; font-weight:600; font-size:.92rem;
    border:2px solid transparent; transition:.15s;
  }
  .btn-primary{background:var(--maroon-600); color:#fff;}
  .btn-primary:hover{background:#8a1f2f;}
  .btn-gold{background:var(--gold-500); color:var(--ink-900);}
  .btn-gold:hover{background:var(--gold-600);}
  .btn-outline{background:transparent; border-color:var(--teal-900); color:var(--teal-900);}
  .btn-outline:hover{background:var(--teal-900); color:#fff;}
  .btn-sm{padding:8px 14px; font-size:.82rem; border-radius:8px;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  /* Signature receipt element */
  .receipt{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px 22px 26px; position:relative; box-shadow:0 14px 34px -18px rgba(15,61,62,.45);
    font-family:var(--font-mono);
  }
  .receipt::before, .receipt::after{
    content:""; position:absolute; left:0; right:0; height:10px;
    background:repeating-linear-gradient(90deg, var(--mint-50) 0 8px, transparent 0 16px);
  }
  .receipt::before{top:-5px;} .receipt::after{bottom:-5px;}
  .receipt .rline{display:flex; justify-content:space-between; font-size:.86rem; padding:5px 0; color:var(--ink-600);}
  .receipt .rline.total{border-top:1px dashed var(--line); margin-top:8px; padding-top:12px; font-weight:700; color:var(--ink-900); font-size:1rem;}
  .receipt .rline.commission span:last-child{color:var(--maroon-600); font-weight:700;}
  .receipt .rline.seller span:last-child{color:var(--teal-700); font-weight:700;}
  .receipt-label{font-family:var(--font-body); font-weight:600; color:var(--teal-900); margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;}
  .pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--gold-500); animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  /* ---------- Grids / Cards ---------- */
  .cat-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin:24px 0 8px;}
  @media (max-width:860px){.cat-grid{grid-template-columns:repeat(2,1fr);}}
  .cat-card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 14px; text-align:center; transition:.15s;
  }
  .cat-card:hover{border-color:var(--gold-500); transform:translateY(-2px);}
  .cat-card .ico{font-size:1.6rem; margin-bottom:8px; display:block;}
  .cat-card .name{font-weight:600; font-size:.86rem; color:var(--teal-900);}

  .steps{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin:20px 0;}
  @media (max-width:860px){.steps{grid-template-columns:1fr;}}
  .step{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:18px;}
  .step .n{font-family:var(--font-mono); color:var(--gold-600); font-weight:700; font-size:.85rem;}

  .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:18px 0;}
  select, input[type=text], input[type=number], input[type=tel], input[type=email], textarea{
    font-family:var(--font-body); border:1px solid var(--line); border-radius:8px;
    padding:9px 12px; font-size:.9rem; background:#fff; color:var(--ink-900);
  }
  textarea{width:100%; resize:vertical;}
  label{font-size:.82rem; font-weight:600; color:var(--ink-600); display:block; margin-bottom:5px;}
  .field{margin-bottom:14px;}

  .service-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:10px;}
  @media (max-width:860px){.service-grid{grid-template-columns:1fr;}}
  .service-card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; display:flex; flex-direction:column; gap:8px;
  }
  .service-card .cat-tag{
    align-self:flex-start; font-family:var(--font-mono); font-size:.68rem; text-transform:uppercase;
    letter-spacing:.06em; background:var(--mint-50); color:var(--teal-700); padding:3px 8px; border-radius:6px;
  }
  .service-card .price{font-family:var(--font-mono); font-weight:700; color:var(--maroon-600); font-size:1.05rem;}
  .service-card .seller-name{font-size:.78rem; color:var(--ink-600);}
  .empty{
    border:1px dashed var(--line); border-radius:var(--radius); padding:34px; text-align:center; color:var(--ink-600);
    background:var(--paper);
  }

  table{width:100%; border-collapse:collapse; background:var(--paper); border-radius:var(--radius); overflow:hidden;}
  th,td{padding:11px 13px; text-align:left; font-size:.86rem; border-bottom:1px solid var(--line);}
  th{background:var(--teal-900); color:#fff; font-weight:600; font-size:.75rem; text-transform:uppercase; letter-spacing:.04em;}
  tr:last-child td{border-bottom:none;}
  .status{padding:3px 9px; border-radius:999px; font-size:.72rem; font-weight:700; font-family:var(--font-mono);}
  .status.pending{background:#FCEFD8; color:var(--gold-600);}
  .status.progress{background:#E3EEF6; color:#2b6ca3;}
  .status.complete{background:#E2F3E9; color:#1e7a4c;}
  .status.paid{background:#E2F3E9; color:#1e7a4c;}

  .kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin:18px 0 30px;}
  @media (max-width:860px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
  .kpi{background:var(--teal-900); color:#fff; border-radius:var(--radius); padding:18px;}
  .kpi .v{font-family:var(--font-mono); font-size:1.6rem; font-weight:700; color:var(--gold-500);}
  .kpi .l{font-size:.76rem; color:#BFD8D1; margin-top:4px;}

  .panel{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:22px; margin-bottom:22px;}
  .split{display:grid; grid-template-columns:1fr 1fr; gap:22px;}
  @media (max-width:860px){.split{grid-template-columns:1fr;}}
  .divider{height:1px; background:var(--line); margin:22px 0;}
  .note{font-size:.82rem; color:var(--ink-600); background:var(--mint-50); border-left:3px solid var(--gold-500); padding:10px 14px; border-radius:6px;}
  .backlink{font-size:.85rem; font-weight:600; color:var(--teal-700); display:inline-flex; gap:6px; align-items:center; margin-bottom:14px;}
  .toast{
    position:fixed; bottom:24px; right:24px; background:var(--teal-900); color:#fff;
    padding:13px 18px; border-radius:10px; font-size:.86rem; font-weight:600;
    box-shadow:0 12px 30px -10px rgba(0,0,0,.4); z-index:80; border-left:4px solid var(--gold-500);
    transform:translateY(20px); opacity:0; transition:.25s;
  }
  .toast.show{transform:translateY(0); opacity:1;}
  footer{text-align:center; padding:26px 20px 40px; font-size:.78rem; color:var(--ink-600);}
</style>
</head>
<body>

<header class="site">
  <div class="site-inner">
    <div class="brand"><span class="mark">HH</span> HussainHub</div>
    <div class="role-switch" id="roleSwitch">
      <button data-role="customer">Customer</button>
      <button data-role="seller">Seller</button>
      <button data-role="admin">Admin</button>
    </div>
  </div>
</header>

<nav class="subnav"><div class="subnav-inner" id="subnav"></div></nav>

<main id="main"></main>

<footer>HussainHub MVP demo — matches the simple marketplace business plan (services, orders, 15% commission, manual payment stage). Data saves to your browser only.</footer>
<div class="toast" id="toast"></div>

<script>
/* ---------------- State ---------------- */
const CATEGORIES = [
  {id:'web', name:'Website Development', icon:'💻'},
  {id:'app', name:'App Development', icon:'📱'},
  {id:'design', name:'Graphic Design', icon:'🎨'},
  {id:'video', name:'Video Editing', icon:'🎬'},
  {id:'social', name:'Social Media Management', icon:'📣'},
];
const COMMISSION_RATE = 0.15;

/* ================================================================
   BACKEND CONNECTION
   Set this to your deployed backend URL (see hussainhub-backend/README.md).
   Example after deploying to Render: "https://hussainhub-backend.onrender.com"
   Leave as "" to run in local-only demo mode (no server, nothing persists).
   ================================================================ */
const API_BASE = "https://hussainhub-backend-production.up.railway.app"; // <-- your live Railway backend
// Optional: must match ADMIN_KEY in the backend's .env, if you set one.
const ADMIN_KEY = "";

const OFFLINE_MODE = !API_BASE;

const DEFAULT_STATE = {
  role:'customer',
  customerView:'home',
  sellerView:'dashboard',
  adminView:'dashboard',
  selectedCategory:'all',
  selectedServiceId:null,
  customerName:'',
  services:[
    {id:'s1', category:'design', title:'I will design a professional logo', seller:'Ayesha Khan', price:2000, desc:'Modern, minimal logo with 2 revisions and source files.'},
    {id:'s2', category:'web', title:'I will build a 5-page business website', seller:'Bilal Sheikh', price:12000, desc:'Responsive website with contact form, hosted on GitHub Pages.'},
    {id:'s3', category:'video', title:'I will edit a short-form reel', seller:'Sana Malik', price:1500, desc:'Trending edit for Instagram/TikTok with captions.'},
    {id:'s4', category:'social', title:'I will manage your Instagram for 1 month', seller:'Hamza Iqbal', price:8000, desc:'12 posts, 4 reels, daily engagement.'},
    {id:'s5', category:'app', title:'I will build a simple Android app MVP', seller:'Zainab Raza', price:25000, desc:'Basic app with 3–4 screens, Firebase backend.'},
  ],
  orders:[],
  withdrawals:[],
  nextOrderId:1,
  nextServiceId:6,
  nextWithdrawalId:1,
  pendingWithdrawals:0,
};

let state = JSON.parse(JSON.stringify(DEFAULT_STATE));

/* ---------------- API layer ---------------- */
async function apiGet(path){
  const res = await fetch(API_BASE + path);
  if(!res.ok) throw new Error('Request failed: ' + path);
  return res.json();
}
async function apiSend(path, method, body, adminOnly){
  const headers = {'Content-Type':'application/json'};
  if(adminOnly && ADMIN_KEY) headers['x-admin-key'] = ADMIN_KEY;
  const res = await fetch(API_BASE + path, { method, headers, body: JSON.stringify(body || {}) });
  if(!res.ok){
    let msg = 'Request failed';
    try{ msg = (await res.json()).error || msg; }catch(e){}
    throw new Error(msg);
  }
  return res.json();
}

async function loadState(){
  if(OFFLINE_MODE){
    toast('Demo mode — koi backend connect nahi hai, data save nahi hoga.');
    render();
    return;
  }
  try{
    const data = await apiGet('/api/state');
    state = Object.assign(state, data);
    render();
    startNotificationPolling();
  }catch(e){
    toast('Backend se connect nahi ho saka. API_BASE URL check karein.');
    render();
  }
}

/* Poll pending-withdrawal count for the admin notification badge */
let pollHandle = null;
function startNotificationPolling(){
  if(pollHandle || OFFLINE_MODE) return;
  pollHandle = setInterval(async ()=>{
    try{
      const { count } = await apiGet('/api/notifications/unread-count');
      if(count !== state.pendingWithdrawals){
        state.pendingWithdrawals = count;
        renderSubnav();
      }
    }catch(e){ /* silent — will retry next interval */ }
  }, 15000);
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove('show'), 2600);
}
function money(n){ return 'Rs. ' + Math.round(n).toLocaleString('en-PK'); }
function catName(id){ return (CATEGORIES.find(c=>c.id===id)||{}).name || id; }

/* ---------------- Nav config ---------------- */
const NAV = {
  customer:[['home','Home'],['services','Services'],['orders','My Orders'],['profile','Profile']],
  seller:[['dashboard','Seller Dashboard'],['addservice','Add Service'],['orders','My Orders'],['earnings','Earnings'],['withdrawal','Withdrawal'],['profile','Profile']],
  admin:[['dashboard','Dashboard'],['services','Services'],['orders','Orders'],['payments','Payments'],['withdrawals','Withdrawals'],['commission','Commission']],
};

document.getElementById('roleSwitch').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-role]');
  if(!btn) return;
  state.role = btn.dataset.role;
  render();
});

function renderSubnav(){
  const items = NAV[state.role];
  const activeKey = state.role==='customer'?state.customerView:state.role==='seller'?state.sellerView:state.adminView;
  document.getElementById('subnav').innerHTML = items.map(([key,label])=>{
    const badge = (state.role==='admin' && key==='withdrawals' && state.pendingWithdrawals>0)
      ? `<span style="display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:999px;background:var(--maroon-600);color:#fff;font-size:.68rem;font-weight:700;font-family:var(--font-mono);vertical-align:middle;">${state.pendingWithdrawals}</span>`
      : '';
    return `<button data-key="${key}" class="${key===activeKey?'active':''}">${label}${badge}</button>`;
  }).join('');
  document.querySelectorAll('#subnav button').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(state.role==='customer') state.customerView = b.dataset.key;
      if(state.role==='seller') state.sellerView = b.dataset.key;
      if(state.role==='admin') state.adminView = b.dataset.key;
      state.selectedServiceId = null;
      render();
    });
  });
  document.querySelectorAll('#roleSwitch button').forEach(b=>{
    b.classList.toggle('active', b.dataset.role===state.role);
  });
}

/* ---------------- Render router ---------------- */
function render(){
  renderSubnav();
  const main = document.getElementById('main');
  if(state.role==='customer') main.innerHTML = renderCustomer();
  else if(state.role==='seller') main.innerHTML = renderSeller();
  else main.innerHTML = renderAdmin();
  bindEvents();
}

/* ---------------- Customer views ---------------- */
function renderCustomer(){
  if(state.selectedServiceId) return renderServiceDetail();
  switch(state.customerView){
    case 'home': return customerHome();
    case 'services': return customerServices();
    case 'orders': return customerOrders();
    case 'profile': return customerProfile();
  }
}

function customerHome(){
  return `
  <section class="hero">
    <div>
      <span class="eyebrow">Digital Services Marketplace</span>
      <h1>Kaam khareedo, kaam becho — HussainHub par.</h1>
      <p class="lede">Logo, website, video edit ya social media management — trusted sellers se seedha order karein. Har order transparent commission ke sath.</p>
      <div class="hero-actions">
        <button class="btn btn-primary" data-nav="customer:services">Services Dekhein</button>
        <button class="btn btn-outline" data-role-switch="seller">Seller Bano</button>
      </div>
    </div>
    <div class="receipt">
      <div class="receipt-label"><span>Live Order Split</span><span class="pulse-dot"></span></div>
      <div class="rline total"><span>Order Value</span><span>Rs. 2,000</span></div>
      <div class="rline seller"><span>Seller Earning (85%)</span><span>Rs. 1,700</span></div>
      <div class="rline commission"><span>HussainHub Commission (15%)</span><span>Rs. 300</span></div>
      <div class="rline"><span>Payment stage</span><span>Manual — WhatsApp/Email</span></div>
    </div>
  </section>

  <h2>Categories</h2>
  <div class="cat-grid">
    ${CATEGORIES.map(c=>`<div class="cat-card" data-nav="customer:services" data-cat="${c.id}"><span class="ico">${c.icon}</span><span class="name">${c.name}</span></div>`).join('')}
  </div>

  <h2 style="margin-top:34px;">Kaise kaam karta hai</h2>
  <div class="steps">
    <div class="step"><div class="n">01</div><h3>Service select karein</h3><p class="lede">Category browse karein aur jo chahiye woh service khol lein.</p></div>
    <div class="step"><div class="n">02</div><h3>Order place karein</h3><p class="lede">Apna naam aur contact dein — order request seller/admin ko chali jayegi.</p></div>
    <div class="step"><div class="n">03</div><h3>Payment & delivery</h3><p class="lede">WhatsApp/email par payment confirm hote hi seller kaam deliver karega.</p></div>
  </div>
  `;
}

function customerServices(){
  const cat = state.selectedCategory;
  const list = state.services.filter(s => cat==='all' || s.category===cat);
  return `
  <span class="eyebrow">Browse</span>
  <h2>Services</h2>
  <div class="toolbar">
    <select id="catFilter">
      <option value="all" ${cat==='all'?'selected':''}>Saari Categories</option>
      ${CATEGORIES.map(c=>`<option value="${c.id}" ${cat===c.id?'selected':''}>${c.name}</option>`).join('')}
    </select>
  </div>
  ${list.length? `<div class="service-grid">${list.map(serviceCard).join('')}</div>` : `<div class="empty">Is category mein abhi koi service nahi. Seller Dashboard se add karein.</div>`}
  `;
}
function serviceCard(s){
  return `<div class="service-card">
    <span class="cat-tag">${catName(s.category)}</span>
    <h3>${s.title}</h3>
    <span class="seller-name">by ${s.seller}</span>
    <span class="price">${money(s.price)}</span>
    <button class="btn btn-gold btn-sm" data-open-service="${s.id}">Details & Order</button>
  </div>`;
}

function renderServiceDetail(){
  const s = state.services.find(x=>x.id===state.selectedServiceId);
  if(!s){ state.selectedServiceId=null; return customerHome(); }
  const commission = s.price*COMMISSION_RATE;
  const sellerCut = s.price - commission;
  return `
  <button class="backlink" data-back-services="1">&larr; Services par wapis</button>
  <div class="split">
    <div class="panel">
      <span class="cat-tag">${catName(s.category)}</span>
      <h1 style="margin-top:10px;">${s.title}</h1>
      <p class="lede">${s.desc}</p>
      <p class="lede"><strong>Seller:</strong> ${s.seller}</p>
      <div class="divider"></div>
      <div class="receipt">
        <div class="receipt-label"><span>Price Breakdown</span></div>
        <div class="rline total"><span>Order Value</span><span>${money(s.price)}</span></div>
        <div class="rline seller"><span>Seller Earning</span><span>${money(sellerCut)}</span></div>
        <div class="rline commission"><span>HussainHub Commission (15%)</span><span>${money(commission)}</span></div>
      </div>
    </div>
    <div class="panel">
      <h3>Order Place Karein</h3>
      <p class="note">MVP stage: koi automatic payment gateway nahi. Order request submit karein — payment instructions WhatsApp/email par milengi.</p>
      <form id="orderForm">
        <div class="field"><label>Aapka naam</label><input type="text" id="ordName" required placeholder="e.g. Ahmed Raza"></div>
        <div class="field"><label>WhatsApp ya Email</label><input type="text" id="ordContact" required placeholder="03xx-xxxxxxx ya email@example.com"></div>
        <button class="btn btn-primary" type="submit">Order Request Bhejein — ${money(s.price)}</button>
      </form>
    </div>
  </div>
  `;
}

function customerOrders(){
  const orders = state.orders.filter(o => o.customerName === state.customerName);
  if(!state.customerName){
    return `<h2>My Orders</h2><div class="empty">Pehle koi order place karein — aapka naam yahan orders dikhane ke liye use hoga.</div>`;
  }
  return `<h2>My Orders — ${state.customerName}</h2>
  ${orders.length? ordersTable(orders, null) : `<div class="empty">Abhi tak koi order nahi.</div>`}`;
}

function customerProfile(){
  return `<h2>Profile</h2>
  <div class="panel">
    <div class="field"><label>Naam</label><input type="text" id="profName" value="${state.customerName}" placeholder="Apna naam likhein"></div>
    <button class="btn btn-gold btn-sm" id="saveProfile">Save</button>
    <p class="note" style="margin-top:14px;">MVP mein full account system nahi hai — naam se hi "My Orders" match hoti hai.</p>
  </div>`;
}

/* ---------------- Seller views ---------------- */
function renderSeller(){
  switch(state.sellerView){
    case 'dashboard': return sellerDashboard();
    case 'addservice': return sellerAddService();
    case 'orders': return sellerOrders();
    case 'earnings': return sellerEarnings();
    case 'withdrawal': return sellerWithdrawal();
    case 'profile': return sellerProfile();
  }
}
function sellerDashboard(){
  const myOrders = state.orders;
  const completed = myOrders.filter(o=>o.status==='complete');
  const earnings = completed.reduce((sum,o)=>sum+o.sellerEarning,0);
  return `
  <h2>Seller Dashboard</h2>
  <div class="kpi-grid">
    <div class="kpi"><div class="v">${state.services.length}</div><div class="l">My Services</div></div>
    <div class="kpi"><div class="v">${myOrders.length}</div><div class="l">Total Orders</div></div>
    <div class="kpi"><div class="v">${completed.length}</div><div class="l">Completed</div></div>
    <div class="kpi"><div class="v">${money(earnings)}</div><div class="l">Total Earnings</div></div>
  </div>
  <div class="panel">
    <h3>Recent Orders</h3>
    ${myOrders.length? ordersTable(myOrders.slice(-5).reverse(), 'seller') : `<div class="empty">Abhi koi order nahi aaya.</div>`}
  </div>
  `;
}
function sellerAddService(){
  return `<h2>Add Service</h2>
  <div class="panel" style="max-width:520px;">
    <form id="addServiceForm">
      <div class="field"><label>Service Title</label><input type="text" id="svcTitle" required placeholder="e.g. I will design a professional logo"></div>
      <div class="field"><label>Category</label>
        <select id="svcCategory">${CATEGORIES.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Price (Rs.)</label><input type="number" id="svcPrice" min="1" required placeholder="2000"></div>
      <div class="field"><label>Seller Name</label><input type="text" id="svcSeller" required placeholder="Aapka naam"></div>
      <div class="field"><label>Description</label><textarea id="svcDesc" rows="3" placeholder="Service ki tafseel"></textarea></div>
      <div class="note" style="margin-bottom:14px;">15% commission automatically apply hoga har order par.</div>
      <button class="btn btn-primary" type="submit">Service Upload Karein</button>
    </form>
  </div>`;
}
function sellerOrders(){
  return `<h2>My Orders (Seller)</h2>
  ${state.orders.length? ordersTable(state.orders, 'seller') : `<div class="empty">Abhi koi order nahi.</div>`}`;
}
function sellerEarnings(){
  const completed = state.orders.filter(o=>o.status==='complete');
  const totalEarned = completed.reduce((s,o)=>s+o.sellerEarning,0);
  const withdrawn = state.withdrawals.filter(w=>w.status==='paid').reduce((s,w)=>s+w.amount,0);
  const pendingW = state.withdrawals.filter(w=>w.status==='pending').reduce((s,w)=>s+w.amount,0);
  const available = totalEarned - withdrawn - pendingW;
  return `<h2>Earnings</h2>
  <div class="kpi-grid">
    <div class="kpi"><div class="v">${money(totalEarned)}</div><div class="l">Total Earned</div></div>
    <div class="kpi"><div class="v">${money(pendingW)}</div><div class="l">Withdrawal Pending</div></div>
    <div class="kpi"><div class="v">${money(withdrawn)}</div><div class="l">Already Paid Out</div></div>
    <div class="kpi"><div class="v">${money(Math.max(available,0))}</div><div class="l">Available Balance</div></div>
  </div>`;
}
function sellerWithdrawal(){
  const completed = state.orders.filter(o=>o.status==='complete');
  const totalEarned = completed.reduce((s,o)=>s+o.sellerEarning,0);
  const used = state.withdrawals.reduce((s,w)=>s+w.amount,0);
  const available = totalEarned - used;
  return `<h2>Withdrawal</h2>
  <div class="panel" style="max-width:480px;">
    <p class="lede">Available Balance: <strong>${money(Math.max(available,0))}</strong></p>
    <form id="withdrawForm">
      <div class="field"><label>Amount (Rs.)</label><input type="number" id="wAmount" min="1" max="${Math.max(available,0)}" required></div>
      <div class="field"><label>Method</label>
        <select id="wMethod"><option>Bank</option><option>JazzCash</option><option>Easypaisa</option></select>
      </div>
      <button class="btn btn-primary" type="submit" ${available<=0?'disabled':''}>Request Withdrawal</button>
    </form>
  </div>
  <div class="panel">
    <h3>Withdrawal History</h3>
    ${state.withdrawals.length? `<table><thead><tr><th>ID</th><th>Amount</th><th>Method</th><th>Status</th></tr></thead><tbody>
      ${state.withdrawals.slice().reverse().map(w=>`<tr><td>#${w.id}</td><td>${money(w.amount)}</td><td>${w.method}</td><td><span class="status ${w.status==='paid'?'paid':'pending'}">${w.status}</span></td></tr>`).join('')}
    </tbody></table>` : `<div class="empty">Koi withdrawal request nahi.</div>`}
  </div>`;
}
function sellerProfile(){
  return `<h2>Seller Profile</h2><div class="panel"><p class="lede">MVP demo — profile management baad mein add hoga. Filhal service add karte waqt apna naam "Seller Name" field mein dein.</p></div>`;
}

/* ---------------- Admin views ---------------- */
function renderAdmin(){
  switch(state.adminView){
    case 'dashboard': return adminDashboard();
    case 'services': return adminServices();
    case 'orders': return adminOrders();
    case 'payments': return adminOrders(true);
    case 'withdrawals': return adminWithdrawals();
    case 'commission': return adminCommission();
  }
}
function adminDashboard(){
  const totalSales = state.orders.reduce((s,o)=>s+o.value,0);
  const totalCommission = state.orders.reduce((s,o)=>s+o.commission,0);
  const sellers = new Set(state.services.map(s=>s.seller)).size;
  return `<h2>Admin Dashboard</h2>
  <div class="kpi-grid">
    <div class="kpi"><div class="v">${state.orders.length}</div><div class="l">Total Orders</div></div>
    <div class="kpi"><div class="v">${money(totalSales)}</div><div class="l">Total Sales</div></div>
    <div class="kpi"><div class="v">${money(totalCommission)}</div><div class="l">Total Commission (15%)</div></div>
    <div class="kpi"><div class="v">${sellers}</div><div class="l">Active Sellers</div></div>
  </div>
  <div class="panel"><h3>Recent Orders</h3>
  ${state.orders.length? ordersTable(state.orders.slice(-6).reverse(), 'admin') : `<div class="empty">Abhi koi order nahi.</div>`}</div>`;
}
function adminServices(){
  return `<h2>Services</h2>
  <table><thead><tr><th>Title</th><th>Category</th><th>Seller</th><th>Price</th></tr></thead><tbody>
  ${state.services.map(s=>`<tr><td>${s.title}</td><td>${catName(s.category)}</td><td>${s.seller}</td><td>${money(s.price)}</td></tr>`).join('')}
  </tbody></table>`;
}
function adminOrders(paymentsView){
  return `<h2>${paymentsView?'Payments':'Orders'}</h2>
  ${state.orders.length? ordersTable(state.orders.slice().reverse(), 'admin') : `<div class="empty">Abhi koi order nahi.</div>`}`;
}
function adminWithdrawals(){
  return `<h2>Withdrawals</h2>
  ${state.withdrawals.length? `<table><thead><tr><th>ID</th><th>Amount</th><th>Method</th><th>Status</th><th>Action</th></tr></thead><tbody>
    ${state.withdrawals.slice().reverse().map(w=>`<tr><td>#${w.id}</td><td>${money(w.amount)}</td><td>${w.method}</td><td><span class="status ${w.status==='paid'?'paid':'pending'}">${w.status}</span></td>
    <td>${w.status==='pending'?`<button class="btn btn-outline btn-sm" data-mark-paid="${w.id}">Mark Paid</button>`:'—'}</td></tr>`).join('')}
  </tbody></table>` : `<div class="empty">Koi withdrawal request nahi.</div>`}`;
}
function adminCommission(){
  const totalCommission = state.orders.reduce((s,o)=>s+o.commission,0);
  const totalSales = state.orders.reduce((s,o)=>s+o.value,0);
  return `<h2>Commission</h2>
  <div class="panel">
    <div class="receipt">
      <div class="receipt-label"><span>Platform Summary</span></div>
      <div class="rline total"><span>Total Sales</span><span>${money(totalSales)}</span></div>
      <div class="rline commission"><span>HussainHub Commission (15%)</span><span>${money(totalCommission)}</span></div>
      <div class="rline seller"><span>Total Seller Payouts</span><span>${money(totalSales-totalCommission)}</span></div>
    </div>
  </div>`;
}

/* ---------------- Shared: orders table ---------------- */
function ordersTable(orders, role){
  // role: 'admin' -> only admin can confirm payment received (unlocks seller's Start button)
  //       'seller' -> can Start (once confirmed) and Mark Complete; sees "Awaiting payment" while pending
  //       anything else -> read-only, no action column
  const showActionCol = role === 'admin' || role === 'seller';
  const statusClass = s => s==='complete' ? 'complete' : s==='progress' ? 'progress' : s==='confirmed' ? 'progress' : 'pending';

  function actionCell(o){
    if (role === 'admin'){
      if (o.status === 'pending') return `<button class="btn btn-outline btn-sm" data-confirm-payment="${o.id}">Confirm Payment</button>`;
      return '—';
    }
    if (role === 'seller'){
      if (o.status === 'pending') return `<span class="note" style="padding:4px 8px;">Payment ka wait — Admin confirm karega</span>`;
      if (o.status === 'confirmed') return `<button class="btn btn-outline btn-sm" data-complete-order="${o.id}">Start</button>`;
      if (o.status === 'progress') return `<button class="btn btn-outline btn-sm" data-complete-order="${o.id}">Mark Complete</button>`;
      return '—';
    }
    return '';
  }

  return `<table><thead><tr><th>ID</th><th>Service</th><th>Customer</th><th>Value</th><th>Commission</th><th>Status</th>${showActionCol?'<th>Action</th>':''}</tr></thead><tbody>
  ${orders.map(o=>`<tr>
    <td>#${o.id}</td>
    <td>${o.serviceTitle}</td>
    <td>${o.customerName}</td>
    <td>${money(o.value)}</td>
    <td>${money(o.commission)}</td>
    <td><span class="status ${statusClass(o.status)}">${o.status}</span></td>
    ${showActionCol? `<td>${actionCell(o)}</td>`:''}
  </tr>`).join('')}
  </tbody></table>`;
}

/* ---------------- Event binding ---------------- */
function bindEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [role,view] = el.dataset.nav.split(':');
      state.role = role; state.customerView = view;
      if(el.dataset.cat) state.selectedCategory = el.dataset.cat;
      render();
    });
  });
  document.querySelectorAll('[data-role-switch]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.role = el.dataset.roleSwitch; state.sellerView='dashboard'; render(); });
  });
  document.querySelectorAll('[data-open-service]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.selectedServiceId = el.dataset.openService; render(); });
  });
  const back = document.querySelector('[data-back-services]');
  if(back) back.addEventListener('click', ()=>{ state.selectedServiceId=null; render(); });

  const catFilter = document.getElementById('catFilter');
  if(catFilter) catFilter.addEventListener('change', e=>{ state.selectedCategory = e.target.value; render(); });

  const orderForm = document.getElementById('orderForm');
  if(orderForm) orderForm.addEventListener('submit', async e=>{
    e.preventDefault();
    if(OFFLINE_MODE){ toast('Backend connect nahi hai — API_BASE set karein.'); return; }
    const s = state.services.find(x=>x.id===state.selectedServiceId);
    const name = document.getElementById('ordName').value.trim();
    const contact = document.getElementById('ordContact').value.trim();
    if(!name || !contact) return;
    const submitBtn = orderForm.querySelector('button[type=submit]');
    submitBtn.disabled = true; submitBtn.textContent = 'Bhej rahe hain...';
    try{
      const order = await apiSend('/api/orders', 'POST', { serviceId: s.id, customerName: name, contact });
      state.orders.push(order);
      state.customerName = name;
      state.selectedServiceId = null;
      state.customerView = 'orders';
      render();
      toast('Order request bhej diya! Payment instructions ke liye ' + contact + ' par WhatsApp/email dekhein.');
    }catch(err){
      toast('Order bhejne mein masla hua: ' + err.message);
      submitBtn.disabled = false; submitBtn.textContent = 'Order Request Bhejein — ' + money(s.price);
    }
  });

  const profSave = document.getElementById('saveProfile');
  if(profSave) profSave.addEventListener('click', ()=>{
    state.customerName = document.getElementById('profName').value.trim();
    render(); toast('Profile save ho gaya.');
  });

  const addSvc = document.getElementById('addServiceForm');
  if(addSvc) addSvc.addEventListener('submit', async e=>{
    e.preventDefault();
    if(OFFLINE_MODE){ toast('Backend connect nahi hai — API_BASE set karein.'); return; }
    const payload = {
      title: document.getElementById('svcTitle').value.trim(),
      category: document.getElementById('svcCategory').value,
      price: Number(document.getElementById('svcPrice').value),
      seller: document.getElementById('svcSeller').value.trim(),
      desc: document.getElementById('svcDesc').value.trim() || 'Service description coming soon.',
    };
    if(!payload.title || !payload.seller || !payload.price) return;
    const submitBtn = addSvc.querySelector('button[type=submit]');
    submitBtn.disabled = true; submitBtn.textContent = 'Upload ho raha hai...';
    try{
      const svc = await apiSend('/api/services', 'POST', payload);
      state.services.push(svc);
      state.sellerView='dashboard';
      render();
      toast('Service upload ho gayi!');
    }catch(err){
      toast('Service add karne mein masla hua: ' + err.message);
      submitBtn.disabled = false; submitBtn.textContent = 'Service Upload Karein';
    }
  });

  document.querySelectorAll('[data-complete-order]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(OFFLINE_MODE){ toast('Backend connect nahi hai — API_BASE set karein.'); return; }
      const id = Number(el.dataset.completeOrder);
      const o = state.orders.find(x=>x.id===id);
      if(!o) return;
      const newStatus = o.status==='confirmed' ? 'progress' : 'complete';
      try{
        const updated = await apiSend('/api/orders/'+id, 'PATCH', { status: newStatus });
        Object.assign(o, updated);
        render();
        toast(o.status==='complete' ? `Order #${o.id} complete ho gaya — seller earning add ho gayi.` : `Order #${o.id} progress mein daal diya.`);
      }catch(err){ toast('Update nahi ho saka: ' + err.message); }
    });
  });

  document.querySelectorAll('[data-confirm-payment]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(OFFLINE_MODE){ toast('Backend connect nahi hai — API_BASE set karein.'); return; }
      const id = Number(el.dataset.confirmPayment);
      const o = state.orders.find(x=>x.id===id);
      if(!o) return;
      try{
        const updated = await apiSend('/api/orders/'+id, 'PATCH', { status: 'confirmed' }, true);
        Object.assign(o, updated);
        render();
        toast(`Order #${o.id} — payment confirm ho gaya, ab seller "Start" kar sakta hai.`);
      }catch(err){ toast('Payment confirm nahi ho saka: ' + err.message); }
    });
  });

  const wForm = document.getElementById('withdrawForm');
  if(wForm) wForm.addEventListener('submit', async e=>{
    e.preventDefault();
    if(OFFLINE_MODE){ toast('Backend connect nahi hai — API_BASE set karein.'); return; }
    const amount = Number(document.getElementById('wAmount').value);
    const method = document.getElementById('wMethod').value;
    if(!amount || amount<=0) return;
    const submitBtn = wForm.querySelector('button[type=submit]');
    submitBtn.disabled = true; submitBtn.textContent = 'Bhej rahe hain...';
    try{
      const w = await apiSend('/api/withdrawals', 'POST', { amount, method, sellerName: state.customerName || null });
      state.withdrawals.push(w);
      render();
      toast('Withdrawal request bhej di gayi — admin ko email notification mil jayegi.');
    }catch(err){
      toast('Withdrawal request mein masla hua: ' + err.message);
      submitBtn.disabled = false; submitBtn.textContent = 'Request Withdrawal';
    }
  });

  document.querySelectorAll('[data-mark-paid]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(OFFLINE_MODE){ toast('Backend connect nahi hai — API_BASE set karein.'); return; }
      const id = Number(el.dataset.markPaid);
      const w = state.withdrawals.find(x=>x.id===id);
      if(!w) return;
      try{
        const updated = await apiSend('/api/withdrawals/'+id, 'PATCH', { status:'paid' }, true);
        Object.assign(w, updated);
        state.pendingWithdrawals = state.withdrawals.filter(x=>x.status==='pending').length;
        render();
        toast(`Withdrawal #${w.id} paid mark ho gaya.`);
      }catch(err){ toast('Update nahi ho saka: ' + err.message); }
    });
  });
}

loadState();
</script>
